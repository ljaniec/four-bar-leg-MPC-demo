[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "four-bar-leg-mpc-demo"
version = "0.2.0"
description = "Constrained kinematic MPC demo for Cartesian foot set-point regulation on one four-bar quadruped leg."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Lukasz Janiec"}]
keywords = [
  "robotics",
  "quadruped",
  "model-predictive-control",
  "set-point-regulation",
  "four-bar-linkage",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "pillow>=9.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
four-bar-leg-mpc-demo = "four_bar_leg_mpc.cli:main"

[project.urls]
Repository = "https://github.com/ljaniec/four-bar-leg-MPC-demo"
UpstreamRobotSoftware = "https://github.com/delipl/quadruped_ros2"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
